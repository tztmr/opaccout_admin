<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短码登录</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #182033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      justify-content: center;
      padding: 24px;
      background: #f7f9fc;
      background: -webkit-radial-gradient(top center, circle, #dce8ff, #f7f9fc 55%);
      background: radial-gradient(circle at top, #dce8ff, #f7f9fc 55%);
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      -webkit-box-shadow: 0 24px 70px rgba(54, 79, 125, 0.16);
      box-shadow: 0 24px 70px rgba(54, 79, 125, 0.16);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      text-align: center;
    }
    .intro {
      margin: 0 0 26px;
      color: #667085;
      line-height: 1.6;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }
    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #cad3e2;
      border-radius: 12px;
      font: inherit;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus {
      border-color: #4f67e8;
      -webkit-box-shadow: 0 0 0 4px rgba(79, 103, 232, 0.12);
      box-shadow: 0 0 0 4px rgba(79, 103, 232, 0.12);
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #4058d6;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    .message {
      min-height: 24px;
      margin: 14px 0 0;
      color: #667085;
      text-align: center;
    }
    .message.error { color: #c1292e; }
    .message.success { color: #16815f; }
  </style>
  <script>
(function initializeShortOpPage(globalObject) {
  function isValidShortCode(value) {
    return /^[1-9][0-9]{8}$/.test(String(value || ""));
  }

  function extractShortCode(locationLike) {
    var pathname = String((locationLike && locationLike.pathname) || "");
    var match = pathname.match(/^\/(?:op\/)?([1-9][0-9]{8})\/?$/);
    return match ? match[1] : "";
  }

  function readErrorMessage(payload, fallback) {
    if (payload && typeof payload === "object" && typeof payload.error === "string" && payload.error) {
      return payload.error;
    }
    return fallback || "短码解析失败";
  }

  function createAppHandoff(options) {
    var appName = options.appName || "抖音";
    var url = options.url;
    var message = options.message;
    var submitButton = options.submitButton;
    var locationLike = options.locationLike;
    var setTimeoutImpl = options.setTimeoutImpl || setTimeout;
    var clearTimeoutImpl = options.clearTimeoutImpl || clearTimeout;
    var navigationTimer;
    var fallbackTimer;

    function restore() {
      clearTimeoutImpl(navigationTimer);
      clearTimeoutImpl(fallbackTimer);
      submitButton.disabled = false;
      message.textContent = "未能自动打开" + appName + "，请确认已安装后重试";
      message.className = "message error";
    }

    message.textContent = "正在打开" + appName + "…";
    message.className = "message success";
    navigationTimer = setTimeoutImpl(function () {
      try {
        locationLike.href = url;
      } catch (error) {
        restore();
      }
    }, 50);
    fallbackTimer = setTimeoutImpl(restore, 1500);

    return { restore: restore };
  }

  var api = {
    createAppHandoff: createAppHandoff,
    extractShortCode: extractShortCode,
    isValidShortCode: isValidShortCode,
    readErrorMessage: readErrorMessage
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }

  if (!globalObject || !globalObject.document) {
    return;
  }

  var documentRef = globalObject.document;
  documentRef.addEventListener("DOMContentLoaded", function () {
    var form = documentRef.querySelector("#short-op-form");
    var input = documentRef.querySelector("#short-code");
    var submitButton = documentRef.querySelector("#submit-short-code");
    var message = documentRef.querySelector("#short-op-message");
    if (!form || !input || !submitButton || !message) {
      return;
    }

    var activeHandoff = null;

    globalObject.addEventListener("pageshow", function () {
      if (activeHandoff) {
        activeHandoff.restore();
        activeHandoff = null;
      } else {
        submitButton.disabled = false;
      }
    });

    var pathCode = extractShortCode(globalObject.location);
    if (pathCode) {
      input.value = pathCode;
    }

    input.addEventListener("input", function () {
      input.value = String(input.value || "").replace(/\D/g, "").slice(0, 9);
      message.textContent = "";
      message.className = "message";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var code = String(input.value || "");
      if (!isValidShortCode(code)) {
        message.textContent = "请输入正确的 9 位短码";
        message.className = "message error";
        return;
      }

      submitButton.disabled = true;
      message.textContent = "正在解析短码…";
      message.className = "message";

      globalObject
        .fetch("/api/op/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "omit",
          cache: "no-store",
          body: JSON.stringify({ code: code })
        })
        .then(function (response) {
          return response
            .json()
            .catch(function () {
              return {};
            })
            .then(function (result) {
              if (!response.ok) {
                throw new Error(readErrorMessage(result, "短码解析失败"));
              }
              if (!result || !result.wakeUrl) {
                throw new Error("短码解析失败");
              }
              return result;
            });
        })
        .then(function (result) {
          var appName =
            result.project && result.project.name ? result.project.name : "抖音";
          activeHandoff = createAppHandoff({
            appName: appName,
            url: result.wakeUrl,
            message: message,
            submitButton: submitButton,
            locationLike: globalObject.location
          });
        })
        .catch(function (error) {
          message.textContent =
            (error && error.message) || "网络异常，请检查网络后重试";
          message.className = "message error";
          submitButton.disabled = false;
        });
    });
  });
}(typeof window === "undefined" ? undefined : window));
</script>
</head>
<body>
  <main>
    <h1>短码登录</h1>
    <p class="intro">请输入收到的 9 位短码，我们会自动打开抖音。</p>
    <form id="short-op-form">
      <label for="short-code">9 位短 OP</label>
      <input
        id="short-code"
        name="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="9"
        pattern="[1-9][0-9]{8}"
        placeholder="123456789"
        required
      >
      <button id="submit-short-code" type="submit">立即打开</button>
      <p id="short-op-message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
