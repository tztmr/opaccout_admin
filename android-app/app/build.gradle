plugins {
    id 'com.android.application'
}

def opApiBaseUrl = providers.gradleProperty('opApiBaseUrl')
    .getOrElse('https://op.tztright.qzz.io')
    .trim()
    .replaceFirst('/+$', '')

if (!(opApiBaseUrl ==~ '^https://[^/?#]+(?:/[^?#]*)?$')) {
    throw new GradleException('opApiBaseUrl must be an absolute HTTPS base URL without query or fragment')
}

def applicationIdOverride = providers.gradleProperty('applicationIdOverride')
    .getOrElse('com.tencent.mobileqq')
    .trim()

if (!(applicationIdOverride ==~ '^[a-zA-Z][a-zA-Z0-9_]*(?:\\.[a-zA-Z][a-zA-Z0-9_]*)+$')) {
    throw new GradleException('applicationIdOverride must be a valid Java-style application ID')
}

android {
    namespace 'com.tencent.mobileqq'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId applicationIdOverride
        minSdk 24
        targetSdk 34
        versionCode 2600
        versionName '9.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'OP_API_BASE_URL', "\"${opApiBaseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

tasks.register('runOfflineOpWakeUrlContract', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(
        layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes'),
        layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')
    )
    mainClass = 'com.tencent.mobileqq.OpWakeUrlBuilderTest'
}

tasks.register('runShortOpApiContract', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(
        layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes'),
        layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')
    )
    mainClass = 'com.tencent.mobileqq.ShortOpApiClientTest'
}

tasks.configureEach {
    if (name == 'testDebugUnitTest') {
        dependsOn 'runOfflineOpWakeUrlContract'
        dependsOn 'runShortOpApiContract'
        failOnNoDiscoveredTests = false
    }
}
