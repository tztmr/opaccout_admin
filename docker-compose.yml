services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --host 127.0.0.1 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      DOUYIN_CHECK_API_URL: ${DOUYIN_CHECK_API_URL:-https://unid.tztright.top/check}
      DOUYIN_PROFILE_API_URL: ${DOUYIN_PROFILE_API_URL:-https://imdesktop.douyin.com/aweme/v1/web/user/profile/other/}
      QQ_OP_PROFILE_API_URL: ${QQ_OP_PROFILE_API_URL:-https://graph.qq.com/user/get_simple_userinfo}
      QQ_OP_APP_ID: ${QQ_OP_APP_ID:-1105602870}
      QQ_OP_PROFILE_TIMEOUT_MS: ${QQ_OP_PROFILE_TIMEOUT_MS:-5000}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - egress

volumes:
  mongo_data:

networks:
  backend:
    internal: true
  egress:
    driver: bridge
